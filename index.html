<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Cid Player Information</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--nav:#173b5c;--bg:#f2f5f7;--card:#fff;--text:#1f2b33;--muted:#687781;--line:#dfe5e9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--nav);color:#fff;padding:13px 14px 12px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px #0003}
h1{font-size:21px;margin:0 0 10px;text-align:center}
.search{width:100%;height:44px;border:0;border-radius:10px;padding:0 13px;font-size:16px;outline:none}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:9px 10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:74px;z-index:40;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid #c4cdd4;background:#f5f7f8;color:#173b5c;border-radius:9px;padding:10px 12px;font-size:13px;font-weight:700;min-height:40px}
.tab.active{background:var(--nav);color:#fff;border-color:var(--nav)}
.summary{max-width:700px;margin:auto;padding:9px 13px;color:var(--muted);font-size:13px}
.page{display:none;max-width:700px;margin:auto;padding:0 10px 30px}.page.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:11px;margin:0 0 8px;overflow:hidden;box-shadow:0 1px 3px #0000000d}
.namebtn{width:100%;background:#fff;border:0;text-align:left;padding:15px 14px;display:flex;justify-content:space-between;align-items:center;color:var(--nav);font-size:17px;font-weight:700}
.details{display:none;border-top:1px solid #e8ecef;padding:12px 13px}.open .details{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{background:#f5f7f8;border-radius:8px;padding:8px;min-height:46px}
.label{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700}.val{font-size:15px;margin-top:3px;font-weight:600;overflow-wrap:anywhere}
.flags{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.flag{text-align:center;background:#fafbfc;border:1px solid #edf0f2;border-radius:8px;padding:7px 2px;font-size:11px;color:#4f5d66}
.flag b{display:block;font-size:18px;line-height:19px}
.empty{padding:35px;text-align:center;color:var(--muted);background:#fff;border-radius:10px}
.status{max-width:700px;margin:12px auto;padding:0 13px;color:var(--muted);font-size:13px}
.error{color:#a52b2b;background:#fff0f0;border:1px solid #efcccc;border-radius:9px;padding:12px}
</style>
</head>
<body>
<header>
<h1>El Cid Player Information</h1>
<input id="search" class="search" placeholder="Search player..." autocomplete="off">
</header>
<nav class="tabs">
<button class="tab active" data-page="master">All Player Info</button>
<button class="tab" data-page="horserace">Horserace</button>
<button class="tab" data-page="putting">Putting</button>
<button class="tab" data-page="scoreboard">Scoreboard</button>
<button class="tab" data-page="dinner">Dinner</button>
</nav>
<div id="status" class="status">Loading player data...</div>
<div id="summary" class="summary"></div>
<section id="master" class="page active"></section>
<section id="horserace" class="page"></section>
<section id="putting" class="page"></section>
<section id="scoreboard" class="page"></section>
<section id="dinner" class="page"></section>

<script>
const EXCEL_FILE = "Club Championship Master Workbook.xlsm";
let DATA = null;

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const has=v=>String(v??"").trim()!=="";
const clean=v=>{
  if(v===null||v===undefined)return "";
  if(typeof v==="number" && Number.isInteger(v)) return v;
  return v;
};
const check=v=>{
  const s=String(v??"").trim().toLowerCase();
  return v===true || s==="true" || s==="yes" || s==="x" || s==="1";
};

function sheetToRows(ws){
  return XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});
}

function getRows(workbook,name){
  const ws=workbook.Sheets[name];
  return ws ? sheetToRows(ws) : [];
}

function loadWorkbook(){
  return fetch(EXCEL_FILE+"?v="+Date.now(),{cache:"no-store"})
    .then(r=>{
      if(!r.ok) throw new Error("Could not load "+EXCEL_FILE+" ("+r.status+")");
      return r.arrayBuffer();
    })
    .then(buf=>{
      const wb=XLSX.read(buf,{type:"array",cellFormula:true,cellHTML:false});
      const masterRows=getRows(wb,"ALL_PLAYERS_MASTER");
      if(!masterRows.length) throw new Error("ALL_PLAYERS_MASTER sheet was not found.");
      const headers=masterRows[0].slice(0,13).map(v=>String(v??"").trim());
      const master=[];
      for(let i=1;i<masterRows.length;i++){
        const r=masterRows[i];
        const last=clean(r[0]), first=clean(r[1]);
        if(has(last)||has(first)){
          const p={};
          headers.forEach((h,j)=>p[h||("Column "+(j+1))]=clean(r[j]));
          master.push(p);
        }
      }
      master.sort((a,b)=>(String(a["LAST"]??"")+" "+String(a["FIRST"]??"")).localeCompare(
        String(b["LAST"]??"")+" "+String(b["FIRST"]??"")
      ));
      DATA={
        master,
        horserace:getRows(wb,"HORSERACE"),
        putting:getRows(wb,"PUTTING"),
        scoreboard:getRows(wb,"SCOREBOARD"),
        dinner:getRows(wb,"DINNER")
      };
      document.getElementById("status").textContent=
        "Data loaded from "+EXCEL_FILE+" • "+master.length+" players";
      render("master");
    })
    .catch(err=>{
      document.getElementById("status").innerHTML=
        '<div class="error"><b>Could not load the Excel file.</b><br>'+
        esc(err.message)+
        '<br><br>Make sure <b>'+esc(EXCEL_FILE)+'</b> is in the same GitHub repository as this index.html.</div>';
    });
}

function gm(p,k){return p[k]??""}

function renderMaster(){
  if(!DATA)return;
  const q=document.getElementById("search").value.trim().toLowerCase();
  const arr=DATA.master.filter(p=>(`${gm(p,"LAST")} ${gm(p,"FIRST")}`).toLowerCase().includes(q));
  document.getElementById("summary").textContent=
    `${arr.length} player${arr.length===1?"":"s"} — sorted by last name`;

  document.getElementById("master").innerHTML=arr.length?arr.map((p,i)=>{
    const fields=[
      ["CRS HDCP",gm(p,"CRS HDCP")],
      ["TEE / DIVISION",gm(p,"TEE / DIVISION")],
      ["CLUB",gm(p,"CLUB")]
    ].filter(x=>has(x[1]));
    const flags=[
      ["Playing",gm(p,"PLAYING?")],
      ["Horse Race",gm(p,"HORSE RACE?")],
      ["Putt",gm(p,"PUTT?")],
      ["Dinner",gm(p,"DINNER?")],
      ["Dinner Guest",gm(p,"DINNER GUEST?")],
      ["Paid",gm(p,"PAID?")],
      ["Scrip",gm(p,"Scrip?")]
    ].filter(x=>has(x[1]));
    const notes=gm(p,"Notes");
    return `<div class="card" id="m${i}">
      <button class="namebtn" onclick="toggle('m${i}')">
        <span>${esc(gm(p,"LAST"))}, ${esc(gm(p,"FIRST"))}</span><span>▼</span>
      </button>
      <div class="details">
        ${fields.length?`<div class="grid">${fields.map(x=>
          `<div class="item"><div class="label">${esc(x[0])}</div><div class="val">${esc(x[1])}</div></div>`
        ).join("")}</div>`:""}
        ${flags.length?`<div class="flags">${flags.map(x=>
          `<div class="flag"><b>${check(x[1])?"☑":"☐"}</b>${esc(x[0])}</div>`
        ).join("")}</div>`:""}
        ${has(notes)?`<div class="item" style="margin-top:8px"><div class="label">Notes</div><div class="val">${esc(notes)}</div></div>`:""}
      </div>
    </div>`;
  }).join(""):'<div class="empty">No players found.</div>';
}

const titles={horserace:"Horserace",putting:"Putting",scoreboard:"Scoreboard",dinner:"Dinner"};

function renderSimple(id){
  if(!DATA)return;
  let rows=DATA[id]||[], body=rows.slice(1);
  if(id==="putting") body=rows.slice(2);
  let arr=body.filter(r=>r.some(has));
  const q=document.getElementById("search").value.trim().toLowerCase();
  if(q)arr=arr.filter(r=>r.slice(0,2).join(" ").toLowerCase().includes(q));
  document.getElementById("summary").textContent=
    `${arr.length} record${arr.length===1?"":"s"} — ${titles[id]}`;

  document.getElementById(id).innerHTML=arr.length?arr.map(r=>{
    const name=id==="putting"?String(r[0]??""):`${r[0]??""}, ${r[1]??""}`;
    let items=id==="horserace"?[["CRS HDCP",r[2]]]:
      id==="scoreboard"?[["HDCP",r[2]],["TEE / DIVISION",r[3]]]:
      id==="dinner"?[["Guest",r[2]],["Paid",r[3]],["Scrip",r[4]],["Notes",r[5]]]:
      [["Round #1",r[2]],["Round #2",r[3]],["Lowest Score",r[4]],["Rank",r[5]]];
    items=items.filter(x=>has(x[1]));
    const content=items.map(x=>{
      if(id==="dinner" && ["Guest","Paid","Scrip"].includes(x[0])){
        const checked=String(x[1]).trim().toLowerCase()==="true";
        return `<div class="item"><div class="label">${esc(x[0])}</div><div class="val" style="font-size:22px">${checked?"☑":"☐"}</div></div>`;
      }
      return `<div class="item"><div class="label">${esc(x[0])}</div><div class="val">${esc(x[1])}</div></div>`;
    }).join("");
    return `<div class="card">
      <div class="namebtn" style="cursor:default"><span>${esc(name)}</span></div>
      <div class="details" style="display:block"><div class="grid">${content}</div></div>
    </div>`;
  }).join(""):'<div class="empty">No records found.</div>';
}

function toggle(id){document.getElementById(id).classList.toggle("open")}
function show(id){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.page===id));
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===id));
  render(id);
}
function render(id){if(id==="master")renderMaster();else renderSimple(id)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>show(b.dataset.page));
document.getElementById("search").oninput=()=>render(document.querySelector(".tab.active").dataset.page);

loadWorkbook();
</script>
</body>
</html>
